services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smarthome_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-smarthome}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smarthome_owner} -d ${POSTGRES_DB:-smarthome}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smarthome_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"

  liquibase:
    image: liquibase/liquibase:4.29
    container_name: liquibase_runner
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /liquibase/project
    volumes:
      - ./:/liquibase/project:ro
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smarthome}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-smarthome_owner}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: changelog/changelog-master.yaml
    command: ["--defaults-file=liquibase.properties", "update"]

volumes:
  postgres_data:
