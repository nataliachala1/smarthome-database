
# SmartHome Database
# Existing PostgreSQL - migration inspection
#
# This file does NOT deploy the backend or the frontend.
# It does NOT create databases, volumes or users.
# It does NOT apply migrations automatically.
#
# Requires an existing PostgreSQL instance
# and a previously audited connection configuration.

services:
  liquibase:
    image: liquibase/liquibase:4.29
    restart: "no"

    profiles:
      - database-inspection

    working_dir: /liquibase/project

    volumes:
      - ./:/liquibase/project:ro

    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://${POSTGRES_HOST:?POSTGRES_HOST requerido}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:?POSTGRES_DB requerido}
      LIQUIBASE_COMMAND_USERNAME: ${LIQUIBASE_DB_USER:?LIQUIBASE_DB_USER requerido}
      LIQUIBASE_COMMAND_PASSWORD: ${LIQUIBASE_DB_PASSWORD:?LIQUIBASE_DB_PASSWORD requerido}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: changelog/changelog-master.yaml

    # Operacion predeterminada: validacion.
    # No realizar update automaticamente.
    command:
      - --defaults-file=liquibase.properties
      - validate

    networks:
      - database

networks:
  database:
    external: true
    name: ${DATABASE_NETWORK:?DATABASE_NETWORK requerido}
