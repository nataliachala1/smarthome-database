# Disposable HU11 test broker only. Mounted read-only by the backend harness.
listener 8883
allow_anonymous false
per_listener_settings false
persistence false
certfile /run/hu11/server.crt
keyfile /run/hu11/server.key
tls_version tlsv1.2
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /run/hu11/dynamic-security.json
log_dest stdout
log_type error
log_type warning
connection_messages false
